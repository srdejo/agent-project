spring:
  application:
    name: agent-project-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agent_project}
    username: ${DB_USER:agent_project}
    password: ${DB_PASSWORD:agent_project}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

agent-project:
  sync:
    inbox-dir: ${SYNC_INBOX_DIR:./data/inbox}

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    co.com.srdejo.agentproject: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    co.com.srdejo.agentproject: INFO
