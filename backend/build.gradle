plugins {
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id 'jacoco'
}

group = 'co.com.srdejo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springBootVersion = "4.1.0"
	mapstructVersion = "1.6.3"
	lombokVersion = "1.18.48"
	lombokMapstructBindingVersion = "0.2.0"
	openApiVersion = "3.1.1"
}

dependencies {
	implementation "org.springframework.boot:spring-boot-starter-webflux:${springBootVersion}"
	implementation "org.springframework.boot:spring-boot-starter-validation:${springBootVersion}"
	implementation "org.springframework.boot:spring-boot-starter-data-r2dbc:${springBootVersion}"
	runtimeOnly "org.postgresql:r2dbc-postgresql"
	implementation "org.springframework.boot:spring-boot-starter-flyway:${springBootVersion}"
	implementation "org.flywaydb:flyway-database-postgresql"
	runtimeOnly "org.postgresql:postgresql"
	developmentOnly "org.springframework.boot:spring-boot-devtools:${springBootVersion}"
	testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
	testImplementation "org.springframework.boot:spring-boot-webflux-test:${springBootVersion}"
	testImplementation "io.projectreactor:reactor-test"

	// Needed at compile time: the JSONB converters build io.r2dbc.postgresql.codec.Json values.
	compileOnly "org.postgresql:r2dbc-postgresql"
	testImplementation "org.postgresql:r2dbc-postgresql"

	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
	testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
	testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${openApiVersion}"
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-parameters'
}

test {
	finalizedBy jacocoTestReport
}

bootJar {
	archiveFileName = 'agent-project-backend.jar'
}
