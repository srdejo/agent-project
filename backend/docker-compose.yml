services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-project-postgres
    environment:
      POSTGRES_DB: agent_project
      POSTGRES_USER: agent_project
      POSTGRES_PASSWORD: agent_project
    ports:
      - "5432:5432"
    volumes:
      - agent-project-postgres-data:/var/lib/postgresql/data

volumes:
  agent-project-postgres-data:
