<div class="min-h-screen">
  <header class="flex items-baseline justify-between gap-3 sm:gap-6 px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-surface-border">
    <div class="flex items-baseline gap-2 sm:gap-3.5 min-w-0">
      <span class="text-[15px] sm:text-[17px] font-bold tracking-tight">OpenClaw</span>
      <span class="text-[13px] sm:text-[17px] font-normal text-ink-muted truncate">Project Control Center</span>
    </div>
    <div class="flex items-center gap-3 sm:gap-5 font-mono text-[10px] sm:text-[11px] text-ink-muted flex-none">
      <span class="flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-status-ok inline-block"></span>
        <span>PUBLIC TRACKING</span>
      </span>
      <span class="hidden sm:inline uppercase">
        @if (lastSync(); as sync) {
          LAST SYNC {{ sync | date: 'dd MMM y HH:mm':'UTC' }} UTC
        } @else {
          NO SYNC YET
        }
      </span>
    </div>
  </header>

  <router-outlet />
</div>
